<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<style>
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 780px;
  height: 150px;
  overflow: hidden;
  background: #030303;
}

body {
  font-family: 'Pretendard', sans-serif;
}

.banner {
  width: 780px;
  height: 150px;
  background: #030303;
  display: flex;
  align-items: center;
  justify-content: center;
}

.event-date {
  color: #f50000;
  font-size: 43px;
  font-weight: 700;
  white-space: nowrap;
  line-height: 1;
}

.blink {
  animation: blink 6s ease-in-out infinite;
}

@keyframes blink {
  0%, 30% {
    opacity: 1;
  }

  36% {
    opacity: 0;
  }

  42% {
    opacity: 1;
  }

  100% {
    opacity: 1;
  }
}
</style>
</head>

<body>

<div class="banner">
  <div class="event-date blink" id="eventDate"></div>
</div>

<script>
function getKoreaDate() {
  const parts = new Intl.DateTimeFormat('en-CA', {
    timeZone: 'Asia/Seoul',
    year: 'numeric',
    month: '2-digit',
    day: '2-digit'
  }).formatToParts(new Date());

  const values = {};

  parts.forEach(part => {
    values[part.type] = part.value;
  });

  return new Date(
    Number(values.year),
    Number(values.month) - 1,
    Number(values.day)
  );
}

const today = getKoreaDate();
const start = new Date(today);

start.setDate(today.getDate() - 7);

function fmt(date) {
  return (date.getMonth() + 1) + '월 ' + date.getDate() + '일';
}

document.getElementById('eventDate').textContent =
  '이벤트 기간: ' + fmt(start) + ' ~ ' + fmt(today);
</script>

</body>
</html>
